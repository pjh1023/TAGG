# @package _global_
defaults:
  - override /dataset: comm20

# Community-small. Table 6: alpha_1 = 0.001, alpha_2 = 0.001
general:
    name : 'comm20'
    gpus : 1
    wandb: 'online'
    resume: null            # If resume, path to ckpt file from outputs directory in main directory
    test_only: null
    check_val_every_n_epochs: 100
    sample_every_val: 10
    samples_to_generate: 20
    samples_to_save: 20
    chains_to_save: 1
    log_every_steps: 50
    number_chain_steps: 50        # Number of frames in each gif
    final_model_samples_to_generate: 20
    final_model_samples_to_save: 20
    final_model_chains_to_save: 10
train:
    n_epochs: 1000
    batch_size: 256
    save_model: True
model:
    n_layers: 8
    lambda_train: [0.001, 0]      # alpha_1
    use_pdm_loss: 0.001           # alpha_2
    extra_features: 'all'
