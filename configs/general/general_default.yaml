# General settings
# Warning: 'debug' and 'test' are reserved names that have a special behavior
name: 'TAGG'

wandb: 'disabled'             # online | offline | disabled
gpus: 1

resume: null            # If resume, path to ckpt file from outputs directory in main directory
test_only: null         # Absolute path to a .ckpt file to evaluate

check_val_every_n_epochs: 10
sample_every_val: 4
val_check_interval: null
samples_to_generate: 32       # We advise to set it to 2 x batch_size maximum
samples_to_save: 20
chains_to_save: 1
log_every_steps: 50
number_chain_steps: 50        # Number of frames in each gif

final_model_samples_to_generate: 32
final_model_samples_to_save: 32
final_model_chains_to_save: 2

evaluate_all_checkpoints: False
